function loadScriptChain(urls, onDone){
  var i = 0;
  function tryNext(){
    if(i >= urls.length){ onDone(false); return; }
    var url = urls[i++];
    var s = document.createElement('script');
    s.src = url;
    s.crossOrigin = 'anonymous';
    s.onload = function(){ onDone(true); };
    s.onerror = function(){ tryNext(); };
    document.head.appendChild(s);
  }
  tryNext();
}

function showError(msg){
  document.getElementById('errmsg').style.display = 'block';
  document.getElementById('errmsg').textContent = msg;
  document.getElementById('retryBtn').style.display = 'inline-block';
}

loadScriptChain(REACT_SOURCES, function(reactOk){
  if(!reactOk){
    showError('Errore: impossibile caricare React da nessuna fonte. Controlla la connessione.');
    return;
  }
  loadScriptChain(REACTDOM_SOURCES, function(domOk){
    if(!domOk){
      showError('Errore: impossibile caricare ReactDOM da nessuna fonte. Controlla la connessione.');
      return;
    }
    runApp();
  });
});

/* ── Transizioni schermata & micro-animazioni ─────────────────────── */
@keyframes screenInFwd {
  from { opacity: 0; transform: translateX(26px); }
  to { opacity: 1; transform: translateX(0); }
}
@keyframes screenInBack {
  from { opacity: 0; transform: translateX(-26px); }
  to { opacity: 1; transform: translateX(0); }
}
.ironlog .screen-anim {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-height: 0;
  animation: screenInFwd 0.3s cubic-bezier(0.16,1,0.3,1);
}
.ironlog .screen-anim.back { animation-name: screenInBack; }
@keyframes rowStaggerIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.ironlog .row-stagger {
  animation: rowStaggerIn 0.32s cubic-bezier(0.16,1,0.3,1) backwards;
}
@keyframes setPulse {
  0% { transform: scale(1); }
  45% { transform: scale(1.3); }
  100% { transform: scale(1); }
}
.ironlog .set-check.done { animation: setPulse 0.32s cubic-bezier(0.34,1.56,0.64,1); }
.ironlog .set-row { transition: opacity 0.25s ease; }
.ironlog .row-card.clickable, .ironlog .btn, .ironlog .icon-btn, .ironlog .tab-btn {
  transition: background 0.15s ease, opacity 0.15s ease, transform 0.1s ease;
}
.ironlog .icon-btn:active, .ironlog .btn:active { transform: scale(0.96); }
@keyframes prPop {
  0% { transform: scale(0); opacity: 0; }
  60% { transform: scale(1.25); opacity: 1; }
  100% { transform: scale(1); }
}
.ironlog .pr-badge {
  display: flex; align-items: center; justify-content: center;
  color: var(--accent);
  animation: prPop 0.4s cubic-bezier(0.34,1.56,0.64,1);
}
.ironlog .confetti-burst {
  position: fixed;
  top: 90px;
  left: 0;
  right: 0;
  height: 0;
  pointer-events: none;
  z-index: 500;
}
.ironlog .confetti-piece {
  position: absolute;
  top: 0;
  width: 6px;
  height: 11px;
  border-radius: 2px;
  animation: confettiFall 0.9s ease-out forwards;
}
@keyframes confettiFall {
  0% { transform: translateY(0) rotate(0deg); opacity: 1; }
  100% { transform: translateY(140px) rotate(340deg); opacity: 0; }
}
.ironlog .pr-popup {
  position: fixed;
  left: 50%;
  top: 90px;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--accent);
  color: var(--accent-ink);
  font-family: var(--font-display, inherit);
  font-weight: 700;
  font-size: 15px;
  letter-spacing: 0.02em;
  padding: 12px 20px;
  border-radius: 100px;
  box-shadow: var(--shadow-3);
  z-index: 501;
  pointer-events: none;
  animation: prPopupPop 0.35s cubic-bezier(0.34,1.56,0.64,1), prPopupOut 0.3s ease 1.5s forwards;
}
@keyframes prPopupPop {
  0% { transform: translateX(-50%) scale(0.6); opacity: 0; }
  60% { transform: translateX(-50%) scale(1.08); opacity: 1; }
  100% { transform: translateX(-50%) scale(1); opacity: 1; }
}
@keyframes prPopupOut {
  0% { opacity: 1; }
  100% { opacity: 0; transform: translateX(-50%) translateY(-8px); }
}

/* ── Masthead con pulsante statistiche ────────────────────────────── */

                if (top === null)
                    return;
                const cur = best[ex.id];
                if (!cur || top > cur.weight) {
                    const topSet = ex.sets.reduce((acc, s) => {
                        if (s.warmup)

                        const w = parseFloat(String(s.weight).replace(",", "."));
                        if (isNaN(w))

                        if (!acc || w > parseFloat(String(acc.weight).replace(",", ".")))
                            return s;
                        return acc;
                    }, null);
                    best[ex.id] = { weight: top, date: h.date, dayName: h.dayName, exName: ex.name, reps: topSet ? topSet.reps : "" };

  --accent-ink: #F5F5F5;
  --danger: #E74C3C;
  --info: #E2472C;
  --success: #2FA84F;
  --border: #D5D5DC;
  --shadow-1: 0 2px 6px rgba(20,20,30,0.10);
  --shadow-2: 0 4px 14px rgba(20,20,30,0.12);
  --shadow-3: 0 14px 34px rgba(20,20,30,0.20);
}
.ironlog .shell {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
  transition: filter 0.7s ease;
  background:
    radial-gradient(circle at 1px 1px, rgba(255,255,255,0.035) 1px, transparent 0) 0 0/18px 18px,
    radial-gradient(ellipse 100% 260px at 50% 0%, color-mix(in srgb, var(--accent) 10%, transparent), transparent),
    var(--bg);
  position: relative;
}
.ironlog .shell.blurred {
  filter: blur(16px) brightness(0.6);
}
.ironlog .welcome-overlay {
  position: fixed;
  inset: 0;
  z-index: 800;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  cursor: pointer;
}
.ironlog .welcome-text {
  font-family: var(--font-display);
  font-size: 27px;
  font-weight: 700;
  color: #fff;
  text-align: center;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  text-shadow: 0 4px 22px rgba(0,0,0,0.65);
  opacity: 0;
  transform: translateY(8px) scale(0.97);
  animation: welcomeTextIn 0.5s ease forwards;
}
.ironlog .welcome-overlay.fading .welcome-text {
  animation: welcomeTextOut 0.65s ease forwards;
}
@keyframes welcomeTextIn {
  from { opacity: 0; transform: translateY(10px) scale(0.96); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes welcomeTextOut {
  from { opacity: 1; transform: translateY(0) scale(1); }
  to { opacity: 0; transform: translateY(-8px) scale(1.02); }
}
.ironlog .masthead {
  padding: 28px 20px 14px;
  border-bottom: none;
  position: sticky;
  top: 0;
  z-index: 50;
  background: var(--bg);
  transition: background 0.25s ease, backdrop-filter 0.25s ease, box-shadow 0.25s ease, padding 0.25s ease;
}
.ironlog .masthead.scrolled, .ironlog .topbar.scrolled {
  background: color-mix(in srgb, var(--bg) 70%, transparent);
  backdrop-filter: blur(12px) saturate(160%);
  -webkit-backdrop-filter: blur(12px) saturate(160%);
  box-shadow: var(--shadow-2);
}
.ironlog .masthead::after,
.ironlog .topbar::after {
  content: "";
  display: block;
  height: 4px;
  margin-top: 14px;
  background: repeating-linear-gradient(-45deg, var(--accent) 0 8px, var(--bg) 8px 16px);
  opacity: 0.9;
}
.ironlog .topbar::after { margin-top: 12px; }
.ironlog .masthead-title {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 32px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  text-shadow: 0 2px 0 rgba(0,0,0,0.3);
}
.ironlog .sync-indicator {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-left: 8px;
  font-size: 10px;
  color: var(--text-muted);
  font-family: var(--font-mono);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  text-shadow: none;
}
.ironlog .sync-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  display: inline-block;
}
.ironlog .sync-dot.saving {
  background: var(--accent);
  animation: pulse 1.2s ease-in-out infinite;
}
.ironlog .sync-dot.saved {
  background: var(--success);
}
@keyframes pulse {
  0%, 100% { opacity: 0.6; }
  50% { opacity: 1; }
}
@keyframes skeletonShimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}
.ironlog .skeleton {
  background: linear-gradient(90deg, var(--surface) 25%, var(--surface-2) 37%, var(--surface) 63%);
  background-size: 400% 100%;
  animation: skeletonShimmer 1.4s ease infinite;
  border-radius: 12px;
}
.ironlog .skeleton-screen { padding: 24px 20px; display: flex; flex-direction: column; gap: 14px; }
.ironlog .skeleton-topbar { height: 26px; width: 150px; border-radius: 6px; margin-bottom: 8px; }
.ironlog .skeleton-card { height: 78px; border-radius: 14px; }
.ironlog .skeleton-line { height: 13px; border-radius: 6px; }
.ironlog .topbar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 18px 14px 0 8px;
  border-bottom: none;
  position: sticky;
  top: 0;
  z-index: 50;
  background: var(--bg);
  transition: background 0.25s ease, backdrop-filter 0.25s ease, box-shadow 0.25s ease;
}

.ironlog .eyebrow {

.ironlog .title-display {

  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.ironlog .icon-btn.danger { color: var(--danger); }
.ironlog .tab-row {

.ironlog .row-main { flex: 1; min-width: 0; }
.ironlog .row-title {
